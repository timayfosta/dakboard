<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" id="metaThemeColor" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Family Admin" />
  <title>Family Board Admin</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("family-admin-theme");
        if (t !== "day" && t !== "night") t = "night";
        document.documentElement.setAttribute("data-theme", t);
        var meta = document.getElementById("metaThemeColor");
        if (meta) meta.setAttribute("content", t === "day" ? "#eef1f6" : "#000000");
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="fonts.css" />
  <link rel="stylesheet" href="admin.css?v=39" />
</head>
<body>
  <div id="loginView" class="login hidden">
    <section class="card">
      <h1 style="font-family:var(--display);font-size:1.8rem;margin-bottom:0.35rem">Family Admin</h1>
      <p class="muted" style="margin-bottom:0.9rem">Connecting to Family Board…</p>
      <button class="btn block" type="button" id="retryAdminBtn">Retry</button>
    </section>
  </div>

  <div id="appView" class="app">
    <header class="top">
      <div class="top-lead">
        <button type="button" class="kiosk-admin-close hidden" id="kioskAdminClose">✕ Close</button>
        <div>
          <h1>Family Admin</h1>
          <div class="sub" id="familyMeta">Loading…</div>
        </div>
      </div>
      <div class="theme-switch" role="group" aria-label="Appearance">
        <button type="button" data-theme-set="day"><span class="ico" aria-hidden="true">☀</span> Day</button>
        <button type="button" data-theme-set="night"><span class="ico" aria-hidden="true">☾</span> Night</button>
      </div>
    </header>
    <main class="content" id="tabContent"></main>
    <nav class="nav" aria-label="Admin sections">
      <button type="button" data-tab="lists" class="active"><span class="ico">🛒</span>Lists</button>
      <button type="button" data-tab="chores"><span class="ico">✅</span>Chores</button>
      <button type="button" data-tab="extras"><span class="ico">⭐</span>Extras</button>
      <button type="button" data-tab="rewards"><span class="ico">🎁</span>Rewards</button>
      <button type="button" data-tab="kids"><span class="ico">👧</span>Kids</button>
      <button type="button" data-tab="more"><span class="ico">⋯</span>More</button>
    </nav>
  </div>

  <div class="toast" id="toast"></div>
  <div class="receipt-overlay" id="receiptOverlay" hidden>
    <article class="receipt-sheet" role="dialog" aria-modal="true" aria-labelledby="receiptWho">
      <button type="button" class="receipt-close" id="receiptClose" aria-label="Close receipt">×</button>
      <header class="receipt-head">
        <div class="shop-name">Star receipt</div>
        <div class="who" id="receiptWho"></div>
      </header>
      <div class="receipt-body" id="receiptBody"></div>
      <footer class="receipt-total">
        <span>Balance</span>
        <span id="receiptTotal">★ 0</span>
      </footer>
    </article>
  </div>

  <script src="/shared/list-undo.js"></script>
  <script src="/shared/screens.js"></script>
  <script src="/shared/live-reload.js"></script>
  <script src="/shared/touch-input-loader.js?v=4"></script>
  <script src="api.js?v=30"></script>
  <script src="app.js?v=50"></script>
</body>
</html>
