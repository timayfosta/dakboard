<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Board — Rewards</title>
  <script src="../shared/config.js"></script>
  <script src="../shared/display-init.js"></script>
  <script src="../shared/kiosk-theme.js"></script>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="../shared/screen-chrome.css" />
  <style>
    .top {
      flex-shrink: 0;
    }

    .top h1 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      line-height: 1;
    }

    .top p {
      color: var(--ink-soft);
      font-weight: 700;
      margin: 0.25rem 0 0.85rem;
    }

    .picker {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .pick {
      border: 3px solid transparent;
      border-radius: 18px;
      background: var(--surface);
      padding: 0.55rem 0.35rem;
      text-align: center;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .pick.active {
      background: var(--surface-2);
      border-color: var(--active, var(--coral));
      transform: translateY(-2px);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--active, var(--coral)) 25%, transparent);
    }

    .pick .name {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3.45rem, 10.2cqw, 4.35rem);
      line-height: 1.05;
    }
    .pick .bal {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.6rem, 7.8cqw, 3.5rem);
      line-height: 1;
      color: var(--gold-ink);
    }
    .pick .bal .emoji {
      font-size: clamp(2.6rem, 7.8cqw, 3.5rem);
      line-height: 1;
    }

    .pick-card {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      min-width: 0;
    }

    .receipt-btn {
      border: 1px solid var(--line);
      background: var(--surface-2);
      color: var(--ink);
      border-radius: 999px;
      font-weight: 800;
      font-size: clamp(1.25rem, 3.6cqw, 1.65rem);
      padding: 0.55rem 0.95rem;
    }

    .receipt-btn.open {
      background: var(--gold-soft);
      color: var(--gold-ink);
      border-color: var(--gold-line);
    }

    .receipt-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 70;
      align-items: center;
      justify-content: center;
      padding: 0.7rem;
      background: rgba(0, 0, 0, 0.62);
    }

    .receipt-overlay.show { display: flex; }

    .receipt-sheet {
      position: relative;
      width: min(96%, 980px);
      height: min(94%, 1680px);
      max-height: 94%;
      display: flex;
      flex-direction: column;
      background: #f4efe4;
      color: #1c1914;
      border-radius: 4px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      font-family: var(--font-display), ui-monospace, "Cascadia Mono", Consolas, monospace;
    }

    .receipt-sheet::before,
    .receipt-sheet::after {
      content: "";
      height: 14px;
      background:
        radial-gradient(circle at 10px 0, transparent 9px, #f4efe4 10px) 0 0 / 20px 14px repeat-x;
    }

    .receipt-sheet::after {
      transform: rotate(180deg);
    }

    .receipt-close {
      position: absolute;
      top: 0.7rem;
      right: 0.7rem;
      width: 72px;
      height: 72px;
      border: 0;
      background: transparent;
      font-size: 3rem;
      line-height: 1;
      color: #1c1914;
    }

    .receipt-head {
      text-align: center;
      padding: 1.4rem 1.2rem 1rem;
      border-bottom: 2px dashed #c4b8a4;
    }

    .receipt-head .shop-name {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 6.4cqw, 2.9rem);
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    .receipt-head .sub {
      font-size: clamp(1.35rem, 3.8cqw, 1.75rem);
      font-weight: 800;
      margin-top: 0.2rem;
    }

    .receipt-head .who {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3.45rem, 10.2cqw, 4.35rem);
      line-height: 1.05;
      margin-top: 0.45rem;
    }

    .receipt-body {
      overflow: auto;
      padding: 0.85rem 1.15rem;
      flex: 1;
      min-height: 0;
    }

    .receipt-line {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.35rem 0.85rem;
      padding: 0.7rem 0.65rem;
      margin: 0 0 0.35rem;
      border-radius: 10px;
      border-bottom: 1px dashed #d7cbb8;
      font-size: clamp(1.725rem, 4.8cqw, 2.25rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .receipt-line .meta {
      grid-column: 1 / -1;
      color: #6b6256;
      font-size: 0.72em;
      font-weight: 700;
    }

    .receipt-line.chore,
    .receipt-line.good {
      color: #157347;
      background: rgba(21, 115, 71, 0.08);
    }

    .receipt-line.consequence,
    .receipt-line.bad {
      color: #b42318;
      background: rgba(180, 35, 24, 0.08);
    }

    .receipt-line.chore .amt,
    .receipt-line.good .amt { color: #157347; }

    .receipt-line.consequence .amt,
    .receipt-line.bad .amt { color: #b42318; }

    .receipt-total {
      padding: 1.1rem 1.2rem 1.35rem;
      border-top: 2px dashed #c4b8a4;
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      font-size: clamp(2.15rem, 6.2cqw, 2.85rem);
    }

    .shop {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 10rem;
    }

    .shop-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.75rem;
      flex-shrink: 0;
    }

    .shop-head h2 {
      font-family: var(--font-display);
      font-size: clamp(2.15rem, 6.2cqw, 2.85rem);
      font-weight: 800;
      line-height: 1.1;
    }

    .balance-pill {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.15rem, 6.2cqw, 2.85rem);
      line-height: 1;
      background: var(--gold-soft);
      color: var(--gold-ink);
      border-radius: 999px;
      padding: 0.45rem 0.95rem;
    }

    .reward-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem;
      overflow: auto;
      flex: 1;
      min-height: 0;
      align-content: start;
    }

    .reward {
      border: 2px solid transparent;
      border-radius: 20px;
      background: var(--panel-strong);
      padding: 0.9rem 0.8rem 0.85rem;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      min-height: 140px;
      transition: transform 0.15s ease, border-color 0.2s ease, opacity 0.2s ease;
    }

    .reward:active { transform: scale(0.97); }

    .reward.locked {
      opacity: 0.55;
    }

    .reward-top {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .reward .icon {
      font-size: clamp(2.6rem, 7.5cqw, 3.4rem);
      line-height: 1;
    }

    .reward .title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.15rem, 6.2cqw, 2.85rem);
      line-height: 1.15;
      flex: 1;
    }

    .reward .cost {
      font-family: var(--font-display);
      font-weight: 800;
      color: var(--gold-ink);
      background: var(--gold-softer);
      border-radius: 999px;
      padding: 0.35rem 0.8rem;
      width: fit-content;
      font-size: clamp(2.15rem, 6.2cqw, 2.85rem);
      line-height: 1;
    }

    .recent {
      flex: 0 1 auto;
      max-height: 52%;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: color-mix(in srgb, var(--gold-soft, var(--gold-wash)) 55%, var(--panel));
      border: 2px solid var(--gold-line, var(--line));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--sunny, #f5c84c) 18%, transparent);
    }

    .recent h2 {
      font-family: var(--font-display);
      font-size: clamp(1.85rem, 5.4cqw, 2.4rem);
      font-weight: 800;
      margin-bottom: 0.55rem;
      flex-shrink: 0;
    }

    .recent-list {
      list-style: none;
      overflow: auto;
      flex: 0 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .recent-list li {
      background: var(--surface);
      border: 2px solid var(--gold-line, var(--line));
      border-radius: 16px;
      padding: 0.75rem 0.9rem;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
      font-size: clamp(1.35rem, 3.8cqw, 1.75rem);
      line-height: 1.2;
    }

    .recent-list .meta {
      color: var(--ink-soft);
      white-space: nowrap;
      font-size: 0.85em;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.4rem;
      transform: translateX(-50%) translateY(20px);
      background: #1e3a4c;
      color: #fff;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 1.15rem;
      padding: 0.85rem 1.2rem;
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 30;
      max-width: 90%;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body class="tv-stage">
  <div class="tv-frame">
  <div class="screen">
    <div data-screen-chrome></div>
    <section class="panel top">
      <div class="picker" id="picker" role="tablist"></div>
    </section>

    <section class="panel shop" aria-label="Rewards">
      <div class="shop-head">
        <h2>Tap to redeem</h2>
        <div class="balance-pill" id="balancePill">★ 0</div>
      </div>
      <div class="reward-grid" id="rewardGrid"></div>
    </section>

    <section class="panel recent" aria-label="Recent redemptions">
      <h2>Recent wins</h2>
      <ul class="recent-list" id="recentList"></ul>
    </section>
  </div>
  <div class="receipt-overlay" id="receiptOverlay" role="dialog" aria-modal="true" aria-labelledby="receiptWho">
    <article class="receipt-sheet">
      <button type="button" class="receipt-close" id="receiptClose" aria-label="Close receipt">×</button>
      <header class="receipt-head">
        <div class="shop-name">FAMILY BOARD</div>
        <div class="sub">STAR RECEIPT</div>
        <div class="who" id="receiptWho"></div>
      </header>
      <div class="receipt-body" id="receiptBody"></div>
      <footer class="receipt-total">
        <span>BALANCE</span>
        <span id="receiptTotal">★ 0</span>
      </footer>
    </article>
  </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="../shared/weather-icons.js"></script>
  <script src="../shared/screen-chrome.js"></script>
  <script src="../shared/family-api.js"></script>
  <script src="../shared/display-sync.js"></script>
  <script src="../shared/live-reload.js"></script>
  <script src="../shared/night-mode.js"></script>
  <script src="../shared/screensaver.js"></script>
  <script src="../shared/fx.js"></script>
  <script src="../shared/screens.js"></script>
  <script src="../shared/kiosk-nav.js?v=3"></script>
  <script>
    const IS_KIOSK_FRAME = new URLSearchParams(location.search).has("frame");
    const state = { data: null, kidId: null, receiptKidId: null, fp: "" };

    if (new URLSearchParams(location.search).has("kiosk")) {
      document.body.classList.add("kiosk");
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2400);
    }

    function activeKids() {
      return (state.data?.kids || []).filter((k) => k.active !== false);
    }

    function activeRewards() {
      return (state.data?.rewards || []).filter((r) => r.active !== false);
    }

    function renderPicker() {
      const kids = activeKids();
      if (!kids.length) {
        document.getElementById("picker").innerHTML =
          `<p style="color:var(--ink-soft);font-weight:700">Add kids in Admin</p>`;
        return;
      }
      if (!state.kidId || !kids.find((k) => k.id === state.kidId)) {
        state.kidId = kids[0].id;
      }

      const root = document.getElementById("picker");
      const ids = kids.map((k) => k.id).join("|");
      if (root.dataset.ids !== ids) {
        root.dataset.ids = ids;
        root.innerHTML = kids
          .map((kid) => {
            const active = kid.id === state.kidId;
            return `
              <div class="pick-card">
                <button class="pick${active ? " active" : ""}" data-kid="${kid.id}" style="--active:${kid.color}">
                  <div class="bal">${kid.emoji ? `<span class="emoji">${kid.emoji}</span> ` : ""}★ ${state.data.balances[kid.id] || 0}</div>
                  <div class="name">${kid.name}</div>
                </button>
                <button type="button" class="receipt-btn${state.receiptKidId === kid.id ? " open" : ""}" data-receipt="${kid.id}">🧾 Receipt</button>
              </div>`;
          })
          .join("");
        root.querySelectorAll("[data-kid]").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.kidId = btn.dataset.kid;
            state.fp = "";
            renderAll();
          });
        });
        root.querySelectorAll("[data-receipt]").forEach((btn) => {
          btn.addEventListener("click", () => openReceipt(btn.dataset.receipt));
        });
        return;
      }

      kids.forEach((kid) => {
        const btn = root.querySelector(`[data-kid="${kid.id}"]`);
        if (!btn) return;
        btn.classList.toggle("active", kid.id === state.kidId);
        btn.querySelector(".bal").innerHTML = `${kid.emoji ? `<span class="emoji">${kid.emoji}</span> ` : ""}★ ${state.data.balances[kid.id] || 0}`;
        const receiptBtn = root.querySelector(`[data-receipt="${kid.id}"]`);
        receiptBtn?.classList.toggle("open", state.receiptKidId === kid.id);
      });
    }

    function renderShop() {
      const kid = activeKids().find((k) => k.id === state.kidId);
      const bal = kid ? state.data.balances[kid.id] || 0 : 0;
      document.getElementById("balancePill").textContent = `★ ${bal}`;

      const grid = document.getElementById("rewardGrid");
      const rewards = activeRewards();
      if (!kid) {
        grid.dataset.ids = "";
        grid.innerHTML = `<p style="color:var(--ink-soft);font-weight:700;padding:1rem">Pick a kid above</p>`;
        return;
      }
      if (!rewards.length) {
        grid.dataset.ids = "";
        grid.innerHTML = `<p style="color:var(--ink-soft);font-weight:700;padding:1rem">Add rewards in Admin</p>`;
        return;
      }

      const ids = rewards.map((r) => r.id).join("|");
      if (grid.dataset.ids === ids && grid.querySelector("[data-reward]")) {
        rewards.forEach((r) => {
          const btn = grid.querySelector(`[data-reward="${r.id}"]`);
          if (!btn) return;
          const can = bal >= r.cost;
          btn.classList.toggle("locked", !can);
          btn.querySelector(".icon").innerHTML = r.icon ? `<span class="emoji">${r.icon}</span>` : "";
          btn.querySelector(".title").textContent = r.title;
          btn.querySelector(".cost").textContent = `★ ${r.cost}`;
        });
        return;
      }

      grid.dataset.ids = ids;
      grid.innerHTML = rewards
        .map((r) => {
          const can = bal >= r.cost;
          return `
            <button class="reward${can ? "" : " locked"}" data-reward="${r.id}">
              <div class="reward-top">
                <div class="icon">${r.icon ? `<span class="emoji">${r.icon}</span>` : ""}</div>
                <div class="cost">★ ${r.cost}</div>
              </div>
              <div class="title">${r.title}</div>
            </button>`;
        })
        .join("");

      grid.querySelectorAll("[data-reward]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const reward = rewards.find((r) => r.id === btn.dataset.reward);
          if (!reward) return;
          const currentKid = activeKids().find((k) => k.id === state.kidId);
          if (!currentKid) return;
          const currentBal = state.data.balances[currentKid.id] || 0;
          if (currentBal < reward.cost) {
            toast(`Need ${reward.cost - currentBal} more stars, ${currentKid.name}!`);
            return;
          }
          try {
            await FamilyAPI.redeemReward(reward.id, currentKid.id);
            state.fp = "";
            state.data = await FamilyAPI.getState();
            FamilyFX.celebrate(document.getElementById("confetti"), btn);
            toast(`${currentKid.emoji || ""} ${currentKid.name} unlocked ${reward.icon || "🎁"} ${reward.title}!`);
            renderAll();
          } catch (err) {
            toast(err.message || "Couldn't redeem — is the server running?");
            console.warn(err);
          }
        });
      });
    }

    const RECENT_WIN_MS = 48 * 60 * 60 * 1000;

    function recentWins() {
      const cutoff = Date.now() - RECENT_WIN_MS;
      return (state.data?.redemptions || []).filter((item) => Number(item.at || 0) >= cutoff);
    }

    function renderRecent() {
      const list = document.getElementById("recentList");
      const items = recentWins();
      if (!items.length) {
        list.innerHTML = `<li><span>No redemptions yet — earn stars on the chore screen!</span></li>`;
        return;
      }
      list.innerHTML = items
        .map((item) => {
          const when = new Date(item.at).toLocaleString(undefined, {
            month: "short",
            day: "numeric",
            hour: "numeric",
            minute: "2-digit",
          });
          return `<li><span>${item.icon || "🎁"} ${item.kidName}: ${item.title}</span><span class="meta">★${item.cost} · ${when}</span></li>`;
        })
        .join("");
    }

    function receiptDate(ms) {
      const d = new Date(ms);
      if (Number.isNaN(d.getTime())) return "";
      return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
    }

    function fillReceipt(kidId) {
      const kid = activeKids().find((k) => k.id === kidId);
      if (!kid) return false;
      const rows = (state.data?.starLog || [])
        .filter((row) => row.kidId === kidId)
        .slice()
        .sort((a, b) => (a.at || 0) - (b.at || 0));
      document.getElementById("receiptWho").textContent = `${kid.emoji || ""} ${kid.name}`;
      const body = document.getElementById("receiptBody");
      if (!rows.length) {
        body.innerHTML = `<p style="text-align:center;font-weight:800;font-size:clamp(1.725rem, 4.8cqw, 2.25rem);color:#6b6256">No activity yet</p>`;
      } else {
        body.innerHTML = rows
          .map((row) => {
            const stars = Number(row.stars || 0);
            const late = row.late ? " · LATE" : "";
            const kind =
              row.type === "consequence" || row.type === "bonus"
                ? "Extra"
                : row.type === "redeem"
                  ? "Reward"
                  : row.type === "adjust"
                    ? "Adjustment"
                    : "Chore";
            const tone =
              row.type === "consequence"
                ? "consequence"
                : row.type === "chore" || row.type === "bonus" || !row.type
                  ? "chore"
                  : stars >= 0
                    ? "good"
                    : "bad";
            return `
              <div class="receipt-line ${tone}">
                <span>${row.icon || ""} ${row.title}</span>
                <span class="amt">${stars >= 0 ? "+" : ""}★${stars}</span>
                <span class="meta">${receiptDate(row.at)} · ${kind}${late}</span>
              </div>`;
          })
          .join("");
      }
      document.getElementById("receiptTotal").textContent = `★ ${state.data.balances[kid.id] || 0}`;
      return true;
    }

    function openReceipt(kidId) {
      if (state.receiptKidId === kidId) {
        closeReceipt();
        return;
      }
      closeReceipt();
      const kid = activeKids().find((k) => k.id === kidId);
      if (!kid || !fillReceipt(kidId)) return;
      state.kidId = kidId;
      state.receiptKidId = kidId;
      document.getElementById("receiptOverlay").classList.add("show");
      document.querySelectorAll("[data-receipt]").forEach((btn) => {
        btn.classList.toggle("open", btn.dataset.receipt === kidId);
      });
    }

    function closeReceipt() {
      state.receiptKidId = null;
      document.getElementById("receiptOverlay").classList.remove("show");
      document.querySelectorAll("[data-receipt]").forEach((btn) => btn.classList.remove("open"));
    }

    function renderAll() {
      renderPicker();
      renderShop();
      renderRecent();
      if (state.receiptKidId) fillReceipt(state.receiptKidId);
    }

    function applyState(data) {
      const fp = JSON.stringify({
        kids: data.kids,
        rewards: data.rewards,
        balances: data.balances,
        redemptions: data.redemptions,
        starLog: data.starLog,
        kidId: state.kidId,
      });
      if (fp === state.fp) return;
      state.fp = fp;
      state.data = data;
      renderAll();
    }

    async function load() {
      try {
        const data = await FamilyAPI.getState(IS_KIOSK_FRAME ? { scope: "rewards" } : undefined);
        applyState(data);
      } catch (err) {
        if (!state.data) {
          document.getElementById("rewardGrid").innerHTML =
            `<p style="color:var(--ink-soft);font-weight:700;padding:1rem">Can't reach Family API.<br/>Run <strong>python server.py</strong></p>`;
        }
        console.warn(err);
      }
    }

    document.getElementById("receiptClose").addEventListener("click", closeReceipt);
    document.getElementById("receiptOverlay").addEventListener("click", (e) => {
      if (e.target.id === "receiptOverlay") closeReceipt();
    });

    ScreenChrome.init();
    load();
    window.addEventListener("family-state-update", (e) => {
      if (IS_KIOSK_FRAME && e.detail) applyState(e.detail);
    });
    if (!IS_KIOSK_FRAME) {
      setInterval(load, 2000);
    }
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && !IS_KIOSK_FRAME) load();
    });
  </script>
</body>
</html>
