<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Board — Home</title>
  <script src="../shared/config.js"></script>
  <script src="../shared/display-init.js"></script>
  <script src="../shared/kiosk-theme.js"></script>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="../shared/screen-chrome.css" />
  <style>
    .screen .panel {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .tv-frame {
      display: flex;
      flex-direction: column;
    }

    .tv-frame > .screen {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    .alert-pill {
      display: none;
      flex-shrink: 0;
      width: 100%;
      padding: 0.35rem 0.65rem 0;
      z-index: 60;
    }

    .alert-pill.show {
      display: block;
    }

    .alert-pill-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.7rem;
      padding: 0.9rem 1.45rem;
      border-radius: 999px;
      border: 2px solid rgba(255, 150, 90, 0.55);
      background: rgba(18, 10, 12, 0.84);
      backdrop-filter: blur(14px);
      color: #fff;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.15rem, 3.8cqw, 1.55rem);
      line-height: 1.2;
      text-wrap: balance;
      box-shadow: 0 10px 40px rgba(239, 68, 68, 0.28);
      cursor: pointer;
    }

    .alert-pill-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff6b35;
      box-shadow: 0 0 16px rgba(255, 107, 53, 0.9);
      flex-shrink: 0;
    }

    .alert-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 80;
      align-items: center;
      justify-content: center;
      padding: 1rem 0.85rem 1.5rem;
      background: rgba(6, 4, 10, 0.48);
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }

    .alert-overlay.show {
      display: flex;
    }

    .alert-card {
      position: relative;
      width: min(96%, 980px);
      max-height: 88%;
      overflow: auto;
      padding: 3rem 2.75rem 2.5rem;
      border-radius: 32px;
      border: 2px solid rgba(255, 130, 80, 0.45);
      background:
        linear-gradient(145deg, rgba(48, 20, 28, 0.92), rgba(24, 14, 32, 0.88)),
        radial-gradient(circle at 20% 0%, rgba(255, 120, 60, 0.22), transparent 55%);
      box-shadow:
        0 32px 100px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      color: #fff;
      animation: alert-card-glow 2.6s ease-in-out infinite;
    }

    @keyframes alert-card-glow {
      0%, 100% {
        border-color: rgba(255, 130, 80, 0.45);
        box-shadow: 0 32px 100px rgba(0, 0, 0, 0.5), 0 0 0 0 rgba(255, 100, 50, 0.2);
      }
      50% {
        border-color: rgba(255, 170, 100, 0.75);
        box-shadow: 0 36px 110px rgba(0, 0, 0, 0.55), 0 0 48px 10px rgba(255, 100, 50, 0.18);
      }
    }

    .alert-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 2;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.85rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      pointer-events: auto;
    }

    .alert-close:active {
      transform: scale(0.94);
    }

    .alert-icon {
      font-size: clamp(3.5rem, 12cqw, 5.25rem);
      line-height: 1;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 6px 24px rgba(255, 120, 60, 0.45));
    }

    .alert-icon.multi {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2em;
    }

    .alert-card .eyebrow {
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: clamp(1.05rem, 3.2cqw, 1.35rem);
      color: rgba(255, 190, 140, 0.98);
      margin-bottom: 0.5rem;
    }

    .alert-card h2 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 8cqw, 3.75rem);
      font-weight: 800;
      line-height: 1.06;
      margin-bottom: 0.85rem;
      text-wrap: balance;
    }

    .alert-card .alert-copy,
    .alert-card .alert-copy p {
      font-weight: 700;
      font-size: clamp(1.35rem, 4.8cqw, 1.95rem);
      line-height: 1.42;
      color: rgba(255, 255, 255, 0.94);
      max-width: none;
      overflow: visible;
      display: block;
      -webkit-line-clamp: unset;
    }

    .alert-item + .alert-item {
      margin-top: 1.15rem;
      padding-top: 1.1rem;
      border-top: 1px solid rgba(255, 255, 255, 0.14);
    }

    .alert-item h3 {
      font-family: var(--font-display);
      font-size: clamp(1.55rem, 5.2cqw, 2.2rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      container-type: size;
    }

    .agenda {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 90%;
      max-height: 90%;
      align-self: start;
      width: 100%;
      overflow: hidden;
      padding: 0.55rem 0.7rem 0.55rem 0.8rem;
      container-type: inline-size;
    }

    .agenda h2,
    .block-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .source-pill,
    .list-source {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .agenda-clip {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .agenda-clip::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 5.5rem;
      pointer-events: none;
      background: linear-gradient(to bottom, transparent, var(--panel) 88%);
    }

    .day-group + .day-group { margin-top: 1rem; }

    .day-head {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      padding: 0.5rem 0.15rem 0.55rem;
      margin-bottom: 0.3rem;
      border-bottom: 1px solid var(--hairline);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.7rem, 4.2cqw, 2.4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .day-head .date-num {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3cqw, 1.7rem);
      font-weight: 800;
      color: var(--ink-soft);
      letter-spacing: 0;
    }

    .agenda-rows {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.38rem;
      padding-top: 0.15rem;
      width: 100%;
    }

    .agenda-row {
      display: grid;
      grid-template-columns: minmax(8.4rem, 30%) 1fr;
      align-items: center;
      gap: 0;
      padding: 0.58rem 0.8rem 0.58rem 0.95rem;
      border: none;
      border-radius: 12px;
      background: color-mix(in srgb, var(--event-color, #8b909a) 20%, transparent);
      box-shadow: inset 5px 0 0 var(--event-color, #8b909a);
    }

    .agenda-row .time {
      font-weight: 800;
      font-size: clamp(1.02rem, 2.5cqw, 1.28rem);
      color: rgba(255, 255, 255, 0.9);
      padding: 0.05rem 0.8rem 0.05rem 0;
      margin-right: 0.75rem;
      border-right: 1px solid rgba(255, 255, 255, 0.16);
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }

    .agenda-row .title {
      font-weight: 700;
      font-size: clamp(1.25rem, 3.2cqw, 1.7rem);
      line-height: 1.3;
      color: #fff;
      min-width: 0;
    }

    .agenda-row.all-day .time {
      color: rgba(255, 255, 255, 0.9);
    }

    .empty-note {
      color: var(--ink-soft);
      font-weight: 700;
      padding: 0.6rem 0.1rem;
      font-size: 1.25rem;
    }

    .right-col {
      display: grid;
      grid-template-rows: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 0.2rem;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      width: 100%;
    }

    .month-panel {
      width: 100%;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0.225rem;
      container-type: size;
    }

    .month-panel .block-title {
      margin-bottom: 0.7rem;
      flex-shrink: 0;
      justify-content: flex-start;
      padding: 0.05rem 0 0.15rem;
      min-height: clamp(2rem, 9cqh, 3rem);
      align-items: flex-end;
    }

    .month-label {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.2rem, 12cqw, 3.6rem);
      color: var(--ink);
      line-height: 1;
    }

    .month-grid-wrap {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      container-type: size;
    }

    .cal-grid {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(6, auto);
      gap: 0.03rem;
      align-content: start;
    }

    .dow {
      text-align: center;
      font-family: var(--font-display);
      font-size: clamp(1.2rem, min(10cqw, 13cqh), 2.1rem);
      font-weight: 800;
      color: var(--ink-soft);
      text-transform: uppercase;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      min-height: 0;
      overflow: hidden;
    }

    .day {
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.55rem, 14cqw, 2.7rem);
      line-height: 1;
      color: var(--ink-soft);
      background: transparent;
      box-sizing: border-box;
      aspect-ratio: 1;
      width: 100%;
      max-height: 100%;
      padding: 0.12em;
      margin: 0;
      justify-self: center;
      align-self: start;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .day.empty { background: transparent; }

    .day.today {
      color: var(--coral);
      border: 1.5px solid var(--coral);
      background: color-mix(in srgb, var(--coral) 12%, transparent);
    }

    .list-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding: 0.2rem 0.5rem 0.35rem;
      height: 100%;
      width: 100%;
    }

    .list-panel[aria-label="Grocery list"] {
      margin-top: -4.5rem;
    }

    .list-panel[aria-label="Reminders"] {
      margin-top: -1.35rem;
    }

    .lists {
      display: contents;
    }

    .list-panel .block-title {
      font-size: clamp(3.45rem, 10.2cqw, 4.35rem);
      margin-bottom: 0.15rem;
      flex-shrink: 0;
    }

    .list-clip {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.08rem;
      flex-shrink: 0;
    }

    .checklist li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem;
      align-items: start;
      background: transparent;
      border-radius: 0;
      padding: 0.18rem 0.12rem;
      border: none;
      border-bottom: 1px solid var(--hairline-mid);
      cursor: default;
      font-weight: 700;
      font-size: clamp(1.725rem, 4.8cqw, 2.25rem);
      line-height: 1.2;
      flex-shrink: 0;
    }

    body:not(.kiosk) .checklist li[data-id] {
      cursor: pointer;
    }

    .checklist li:last-child {
      border-bottom: none;
    }

    .checklist li .txt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      min-width: 0;
    }

    .checklist li.empty-list {
      cursor: default;
      color: var(--ink-soft);
      grid-template-columns: 1fr;
      background: transparent;
      border: none;
      font-size: 1.575rem;
      white-space: normal;
    }

    .checklist .list-dot {
      color: var(--ink-soft);
      font-size: 2.025rem;
      line-height: 1.2;
      width: 27px;
      text-align: center;
    }

    .box {
      width: 30px;
      height: 30px;
      border-radius: 6px;
      border: 1.5px solid var(--check-border);
      background: transparent;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
      color: var(--on-accent);
    }

    .checklist li.done .box {
      background: var(--mint);
      border-color: var(--mint);
    }

    .list-panel .list-add-btn {
      font-size: 1.32rem;
      padding: 0.35rem 0.1rem;
      flex-shrink: 0;
    }

    .add-row {
      display: none;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.5);
      animation: live 2s ease-in-out infinite;
      display: inline-block;
      margin-right: 0.35rem;
    }

    @keyframes live {
      0%, 100% { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.45); }
      50% { box-shadow: 0 0 0 5px rgba(61, 220, 151, 0); }
    }
  </style>
</head>
<body class="tv-stage">
  <div class="tv-frame">
    <div class="alert-pill" id="alertPill">
      <button type="button" class="alert-pill-btn" id="alertPillBtn" aria-label="Open weather advisory">
        <span class="alert-pill-dot" aria-hidden="true"></span>
        <span id="alertPillLabel">Weather advisory</span>
      </button>
    </div>

    <div class="alert-overlay" id="alertOverlay" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
      <article class="alert-card">
        <button type="button" class="alert-close" id="alertClose" aria-label="Dismiss weather advisory">×</button>
        <div class="alert-icon" id="alertIcon" aria-hidden="true">⚠️</div>
        <div class="eyebrow" id="alertEyebrow">Weather alert</div>
        <h2 id="alertTitle">Severe weather</h2>
        <div class="alert-copy" id="alertBody"></div>
      </article>
    </div>

    <div class="screen">
      <div data-screen-chrome></div>

      <div class="body">
        <section class="panel agenda" aria-label="Weekly agenda">
          <div class="agenda-clip">
            <div id="agendaList"></div>
          </div>
        </section>

        <div class="right-col">
          <section class="panel month-panel" aria-label="Monthly calendar">
            <div class="block-title">
              <span class="month-label" id="monthLabel"></span>
            </div>
            <div class="month-grid-wrap">
              <div class="cal-grid" id="calGrid"></div>
            </div>
          </section>

          <div class="lists">
            <section class="panel list-panel" aria-label="Grocery list">
              <div class="block-title">
                <span>Groceries</span>
              </div>
              <div class="list-clip">
                <ul class="checklist" id="groceryList" data-list="grocery"></ul>
              </div>
              <button type="button" class="list-add-btn" data-open-list="grocery">+ Add grocery</button>
            </section>
            <section class="panel list-panel" aria-label="Reminders">
              <div class="block-title">
                <span>Reminders</span>
              </div>
              <div class="list-clip">
                <ul class="checklist" id="reminderList" data-list="reminders"></ul>
              </div>
              <button type="button" class="list-add-btn" data-open-list="reminders">+ Add reminder</button>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/weather-icons.js"></script>
  <script src="../shared/screen-chrome.js"></script>
  <script src="../shared/touch-input-loader.js?v=4"></script>
  <script src="../shared/calendar-colors.js"></script>
  <script src="../shared/calendar.js"></script>
  <script src="../shared/family-api.js"></script>
  <script src="../shared/list-undo.js"></script>
  <script src="../shared/display-sync.js"></script>
  <script src="../shared/live-reload.js"></script>
  <script src="../shared/night-mode.js"></script>
  <script src="../shared/screensaver.js"></script>
  <script src="../shared/alerts.js"></script>
  <script src="../shared/screens.js"></script>
  <script src="../shared/kiosk-nav.js?v=3"></script>
  <script>
    const CFG = window.FAMILY_CONFIG;
    let events = [];
    let agendaKids = CFG.kids || [];
    const listState = {
      grocery: { items: [] },
      reminders: { items: [] },
    };

    const IS_KIOSK = new URLSearchParams(location.search).has("kiosk");
    if (IS_KIOSK) {
      document.body.classList.add("kiosk");
    }

    const alertUI = {
      currentId: null,
      currentIds: [],
      dismissed: false,
      autoCloseTimer: null,
    };
    const ALERT_AUTO_CLOSE_MS = 10000;
    const ALERT_DISMISS_STORE = "fb-alert-dismiss-ids";

    function alertIdOf(alert) {
      return alert.id || `${alert.event}:${alert.severity}`;
    }

    function readDismissedAlertIds() {
      try {
        const raw = sessionStorage.getItem(ALERT_DISMISS_STORE);
        return new Set(raw ? JSON.parse(raw) : []);
      } catch {
        return new Set();
      }
    }

    function markAlertsDismissed(ids) {
      const seen = readDismissedAlertIds();
      ids.forEach((id) => seen.add(id));
      try {
        sessionStorage.setItem(ALERT_DISMISS_STORE, JSON.stringify([...seen]));
      } catch (_) {
        /* quota / private mode */
      }
    }

    function alertIconFor(eventName) {
      const name = String(eventName || "").toLowerCase();
      if (name.includes("tornado")) return "🌪️";
      if (name.includes("thunder") || name.includes("lightning")) return "⛈️";
      if (name.includes("flood")) return "🌊";
      if (name.includes("winter") || name.includes("snow") || name.includes("ice")) return "❄️";
      if (name.includes("heat")) return "🌡️";
      if (name.includes("wind")) return "💨";
      if (name.includes("fire")) return "🔥";
      if (name.includes("fog")) return "🌫️";
      return "⚠️";
    }

    function clearAlertAutoClose() {
      if (alertUI.autoCloseTimer) {
        clearTimeout(alertUI.autoCloseTimer);
        alertUI.autoCloseTimer = null;
      }
    }

    function setAlertOverlayOpen(open, { autoClose = false } = {}) {
      const overlay = document.getElementById("alertOverlay");
      const pill = document.getElementById("alertPill");
      overlay.classList.toggle("show", open);
      pill.classList.toggle("show", !open && !!alertUI.currentId);
      clearAlertAutoClose();
      if (open && autoClose) {
        alertUI.autoCloseTimer = setTimeout(dismissAlertOverlay, ALERT_AUTO_CLOSE_MS);
      }
    }

    function dismissAlertOverlay() {
      markAlertsDismissed(alertUI.currentIds);
      alertUI.dismissed = true;
      setAlertOverlayOpen(false);
    }

    function hideAlertUI() {
      clearAlertAutoClose();
      alertUI.currentId = null;
      alertUI.currentIds = [];
      alertUI.dismissed = false;
      document.getElementById("alertOverlay").classList.remove("show");
      document.getElementById("alertPill").classList.remove("show");
    }

    function renderAlertCard(alerts) {
      const top = alerts[0];
      const many = alerts.length > 1;
      const iconEl = document.getElementById("alertIcon");
      const icons = [];
      alerts.forEach((a) => {
        const icon = alertIconFor(a.event);
        if (!icons.includes(icon)) icons.push(icon);
      });
      iconEl.replaceChildren();
      icons.slice(0, 3).forEach((icon) => {
        const span = document.createElement("span");
        span.className = "emoji";
        span.textContent = icon;
        iconEl.appendChild(span);
      });
      iconEl.classList.toggle("multi", icons.length > 1);

      document.getElementById("alertEyebrow").textContent = many
        ? `${alerts.length} alerts · National Weather Service`
        : `${top.severity} · National Weather Service`;
      document.getElementById("alertTitle").textContent = many ? "Weather alerts" : top.event;

      const body = document.getElementById("alertBody");
      body.replaceChildren();
      if (!many) {
        body.textContent = top.headline || top.description;
      } else {
        alerts.forEach((a) => {
          const section = document.createElement("section");
          section.className = "alert-item";
          const heading = document.createElement("h3");
          const ico = document.createElement("span");
          ico.className = "emoji";
          ico.textContent = alertIconFor(a.event);
          heading.append(ico, document.createTextNode(a.event));
          const copy = document.createElement("p");
          copy.textContent = a.headline || a.description;
          section.append(heading, copy);
          body.appendChild(section);
        });
      }

      document.getElementById("alertPillLabel").textContent = alerts.map((a) => a.event).join(" · ");
    }

    function showAlertUI(alerts, { forceOpen = false } = {}) {
      const overlay = document.getElementById("alertOverlay");
      const ids = alerts.map(alertIdOf);
      const fingerprint = ids.slice().sort().join("|");
      const isNew = alertUI.currentId !== fingerprint;

      if (isNew) {
        alertUI.currentId = fingerprint;
        alertUI.currentIds = ids;
        const seen = readDismissedAlertIds();
        alertUI.dismissed = ids.every((id) => seen.has(id));
      } else {
        alertUI.currentIds = ids;
      }

      renderAlertCard(alerts);

      if (forceOpen) {
        setAlertOverlayOpen(true);
        return;
      }

      const overlayOpen = overlay.classList.contains("show");
      if (isNew) {
        setAlertOverlayOpen(!alertUI.dismissed, { autoClose: !alertUI.dismissed });
        return;
      }
      if (!overlayOpen) {
        setAlertOverlayOpen(!alertUI.dismissed, { autoClose: !alertUI.dismissed });
      }
    }

    async function loadAlerts() {
      const demo = new URLSearchParams(location.search).has("demoAlert");
      try {
        const alerts = demo
          ? [
              {
                id: "demo-severe-thunderstorm",
                event: "Severe Thunderstorm Warning",
                severity: "Severe",
                headline: "DEMO: Severe thunderstorms capable of damaging winds and large hail are moving through your area. Take shelter indoors away from windows until the storm passes.",
                description: "",
              },
              {
                id: "demo-flash-flood",
                event: "Flash Flood Warning",
                severity: "Severe",
                headline: "DEMO: Flash flooding is occurring. Move to higher ground. Do not drive through flooded roadways.",
                description: "",
              },
            ]
          : await FamilyAlerts.fetchAlerts(CFG);
        if (!alerts.length) {
          hideAlertUI();
          return;
        }
        showAlertUI(alerts);
      } catch (err) {
        console.warn("Alert fetch failed", err);
        hideAlertUI();
      }
    }

    document.getElementById("alertClose").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      dismissAlertOverlay();
    });

    document.getElementById("alertOverlay").addEventListener("click", (e) => {
      if (e.target.id === "alertOverlay") dismissAlertOverlay();
    });

    document.getElementById("alertPillBtn").addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      setAlertOverlayOpen(true);
    });

    function renderMonth() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      document.getElementById("monthLabel").textContent = now.toLocaleDateString(undefined, {
        month: "long",
        year: "numeric",
      });

      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";
      ["S", "M", "T", "W", "T", "F", "S"].forEach((d) => {
        const el = document.createElement("div");
        el.className = "dow";
        el.textContent = d;
        grid.appendChild(el);
      });

      const startDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < startDow; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        grid.appendChild(empty);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.className = "day" + (day === now.getDate() ? " today" : "");
        cell.textContent = day;
        grid.appendChild(cell);
      }
      const dayCells = 42;
      const filled = startDow + daysInMonth;
      for (let i = filled; i < dayCells; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        grid.appendChild(empty);
      }
    }

    function dayKey(d) {
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function dayHeading(d) {
      const now = FamilyCalendar.startOfDay(new Date());
      const day = FamilyCalendar.startOfDay(d);
      const diff = Math.round((day - now) / 86400000);
      const dateNum = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      if (diff === 0) return { label: "Today", showDate: false };
      if (diff === 1) return { label: "Tomorrow", showDate: false };
      return {
        label: d.toLocaleDateString(undefined, { weekday: "long" }),
        dateNum,
        showDate: true,
      };
    }

    function formatTime(ev) {
      if (ev.allDay) return "All day";
      const opts = { hour: "numeric", minute: "2-digit" };
      const start = ev.start.toLocaleTimeString(undefined, opts);
      if (!ev.end || ev.end <= ev.start) return start;
      const sameDay =
        ev.end.getFullYear() === ev.start.getFullYear() &&
        ev.end.getMonth() === ev.start.getMonth() &&
        ev.end.getDate() === ev.start.getDate();
      if (!sameDay) return start;
      return `${start} - ${ev.end.toLocaleTimeString(undefined, opts)}`;
    }

    let calendarSource = "";
    let calendarError = "";

    function renderAgenda() {
      const root = document.getElementById("agendaList");
      // Pull extra events; clip/fade hides overflow instead of scrolling
      const items = FamilyCalendar.upcoming(events, 40);
      if (!items.length) {
        if (calendarError && (calendarSource === "offline" || calendarSource === "demo")) {
          root.innerHTML = `<div class="empty-note">Google Calendar offline<br><span style="font-size:0.75em;opacity:0.75">${calendarError}</span></div>`;
        } else {
          root.innerHTML = `<div class="empty-note">No upcoming events</div>`;
        }
        return;
      }

      const groups = [];
      const map = new Map();
      items.forEach((ev) => {
        const key = dayKey(ev.start);
        if (!map.has(key)) {
          const g = { key, start: FamilyCalendar.startOfDay(ev.start), events: [] };
          map.set(key, g);
          groups.push(g);
        }
        map.get(key).events.push(ev);
      });

      root.innerHTML = groups
        .map((g) => {
          const head = dayHeading(g.start);
          const dateHtml = head.showDate
            ? `<span class="date-num">${head.dateNum}</span>`
            : "";
          const rows = g.events
            .map((ev) => {
              const color = FamilyCalendarColors.resolveColor(ev, agendaKids);
              return `
              <li class="agenda-row${ev.allDay ? " all-day" : ""}" style="--event-color:${color}">
                <div class="time">${formatTime(ev)}</div>
                <div class="title">${ev.title}</div>
              </li>`;
            })
            .join("");
          return `
            <section class="day-group">
              <div class="day-head">
                <span>${head.label}</span>
                ${dateHtml}
              </div>
              <ul class="agenda-rows">${rows}</ul>
            </section>`;
        })
        .join("");
    }

    function listItemsForDisplay(items) {
      return (items || []).filter((item) => !item.done);
    }

    function syncListStateFromApi(state) {
      listState.grocery.items = state.lists?.grocery || [];
      listState.reminders.items = state.lists?.reminders || [];
      listsFp = JSON.stringify({
        grocery: listState.grocery.items,
        reminders: listState.reminders.items,
      });
      renderChecklist("grocery");
      renderChecklist("reminders");
    }

    async function clearListItem(kind, itemId) {
      if (IS_KIOSK || document.body.classList.contains("kiosk")) return;
      const res = await FamilyAPI.toggleListItem(kind, itemId);
      syncListStateFromApi(res.state);
      if (res.item && window.ListUndo) {
        ListUndo.offer(`Removed "${res.item.text}"`, async () => {
          const undo = await FamilyAPI.restoreListItem(kind, res.item, res.index);
          syncListStateFromApi(undo.state);
        });
      }
    }

    function wireChecklists() {
      // Clear grocery/reminders only from Admin — never on the kiosk
      if (IS_KIOSK || document.body.classList.contains("kiosk")) return;

      document.querySelectorAll(".checklist[data-list]").forEach((ul) => {
        if (ul.dataset.bound === "1") return;
        ul.dataset.bound = "1";
        ul.addEventListener("click", async (e) => {
          if (IS_KIOSK || document.body.classList.contains("kiosk")) return;
          const li = e.target.closest("li[data-id]");
          if (!li) return;
          e.preventDefault();
          e.stopPropagation();
          try {
            await clearListItem(ul.dataset.list, li.dataset.id);
          } catch (err) {
            console.warn("Failed to clear list item", err);
          }
        });
      });
    }

    function renderChecklist(kind) {
      const listId = kind === "grocery" ? "groceryList" : "reminderList";
      const state = listState[kind];
      const root = document.getElementById(listId);
      const items = listItemsForDisplay(state.items);
      const canClear = !(IS_KIOSK || document.body.classList.contains("kiosk"));

      if (!items.length) {
        root.dataset.ids = "";
        root.innerHTML = canClear
          ? `<li class="empty-list">No items yet — tap + Add below</li>`
          : `<li class="empty-list">No items yet — tap + Add, or clear from Admin</li>`;
        return;
      }

      const ids = items.map((item) => item.id).join("|");
      if (root.dataset.ids === ids && root.querySelector("li")) {
        items.forEach((item, index) => {
          const li = root.children[index];
          if (!li || li.classList.contains("empty-list")) return;
          const txt = li.querySelector(".txt");
          if (txt) txt.textContent = item.text;
          if (canClear) li.dataset.id = item.id;
          else delete li.dataset.id;
        });
        return;
      }

      root.dataset.ids = ids;
      root.innerHTML = items
        .map(
          (item) => `
          <li${canClear ? ` data-id="${item.id}"` : ""}>
            <span class="list-dot" aria-hidden="true">•</span>
            <span class="txt">${item.text}</span>
          </li>`
        )
        .join("");
      wireChecklists();
    }

    function wireListAddButtons() {
      document.querySelectorAll("[data-open-list]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const kind = btn.dataset.openList;
          const isGrocery = kind === "grocery";
          TouchInput.open({
            title: isGrocery ? "Add grocery" : "Add reminder",
            placeholder: isGrocery ? "Swipe or type an item…" : "Swipe or type a reminder…",
            mode: "add",
            submitLabel: "Add",
            stayOpen: true,
            onSubmit: async (text) => {
              const itemText = String(text || "").trim();
              if (!itemText) return;
              const res = await FamilyAPI.addListItem(kind, itemText);
              listsFetchId += 1;
              if (res?.state) syncListStateFromApi(res.state);
              else await loadLists();
              if (res.item && window.ListUndo) {
                ListUndo.offer(`Added "${itemText}"`, async () => {
                  const undo = await FamilyAPI.toggleListItem(kind, res.item.id, {
                    allowOnKiosk: true,
                  });
                  listsFetchId += 1;
                  if (undo?.state) syncListStateFromApi(undo.state);
                  else await loadLists();
                });
              }
            },
          });
        });
      });
    }

    let eventsFp = "";
    let listsFp = "";
    let listsFetchId = 0;

    async function loadCalendar() {
      const result = await FamilyCalendar.loadEvents(CFG);
      calendarSource = result.source || "";
      calendarError = result.error || "";
      const fp = JSON.stringify(
        [calendarSource, calendarError].concat(
          (result.events || []).map((e) => [e.id, e.title, +e.start, +e.end, e.allDay])
        )
      );
      if (fp === eventsFp) return;
      eventsFp = fp;
      events = result.events;
      if (calendarSource === "demo" && calendarError) {
        console.warn("Using demo calendar events:", calendarError);
      }
      renderAgenda();
      renderMonth();
    }

    async function loadLists() {
      const fetchId = ++listsFetchId;
      try {
        const data = await FamilyAPI.getState(IS_KIOSK ? { scope: "calendar" } : undefined);
        if (fetchId !== listsFetchId) return;
        applyListState(data);
      } catch (err) {
        if (fetchId !== listsFetchId) return;
        console.warn("Family API lists unavailable.", err);
        document.getElementById("groceryList").innerHTML =
          `<li class="empty-list">Can't reach server — run <strong>python server.py</strong></li>`;
        document.getElementById("reminderList").innerHTML =
          `<li class="empty-list">Can't reach server</li>`;
      }
    }

    function applyListState(data) {
      agendaKids = data.kids?.length ? data.kids : CFG.kids || [];
      const nextGrocery = data.lists?.grocery || [];
      const nextReminders = data.lists?.reminders || [];
      const fp = JSON.stringify({ grocery: nextGrocery, reminders: nextReminders });
      if (fp === listsFp) return;
      listsFp = fp;
      listState.grocery.items = nextGrocery;
      listState.reminders.items = nextReminders;
      renderChecklist("grocery");
      renderChecklist("reminders");
      renderAgenda();
    }

    wireListAddButtons();
    wireChecklists();

    window.addEventListener("family-state-update", (e) => {
      const data = e.detail;
      if (!data?.lists) return;
      listsFetchId += 1;
      applyListState(data);
    });

    ScreenChrome.init();
    loadAlerts();
    loadCalendar();
    loadLists();

    // Realtime-ish refresh cadence (Pi kiosk friendly — active screen only)
    const activeOnly = window.DisplayActive?.whenActive || ((fn) => fn);
    setInterval(activeOnly(loadAlerts), 3 * 60 * 1000);
    setInterval(activeOnly(loadCalendar), 60 * 1000);
    if (!IS_KIOSK) {
      setInterval(loadLists, 2500);
    }
    // Month highlight only needs day-rollover checks
    setInterval(() => {
      const day = new Date().getDate();
      if (loadLists._day !== day) {
        loadLists._day = day;
        renderMonth();
      }
    }, 30 * 1000);

    // Refresh when coming back online / tab visible
    window.addEventListener("online", () => {
      loadCalendar();
      loadLists();
      loadAlerts();
    });
    document.addEventListener("visibilitychange", () => {
      if (!window.DisplayActive?.isActive?.()) return;
      loadCalendar();
      if (!IS_KIOSK) loadLists();
    });
  </script>
</body>
</html>
