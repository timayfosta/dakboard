<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Board — Home</title>
  <script src="../shared/config.js"></script>
  <script src="../shared/display-init.js"></script>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="../shared/touch-input.css" />
  <style>
    .screen .panel {
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
    }

    .clock-card {
      padding: 0.35rem 0.55rem;
    }

    .weather-strip {
      padding: 0.3rem 0.25rem;
    }

    .tv-frame {
      display: flex;
      flex-direction: column;
    }

    .tv-frame > .screen {
      flex: 1;
      min-height: 0;
      height: auto;
    }

    .alert-pill {
      display: none;
      flex-shrink: 0;
      width: 100%;
      padding: 0.35rem 0.65rem 0;
      z-index: 60;
    }

    .alert-pill.show {
      display: block;
    }

    .alert-pill-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      padding: 0.9rem 1.45rem;
      border-radius: 999px;
      border: 2px solid rgba(255, 150, 90, 0.55);
      background: rgba(18, 10, 12, 0.84);
      backdrop-filter: blur(14px);
      color: #fff;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.15rem, 3.8cqw, 1.55rem);
      line-height: 1.1;
      box-shadow: 0 10px 40px rgba(239, 68, 68, 0.28);
      cursor: pointer;
    }

    .alert-pill-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ff6b35;
      box-shadow: 0 0 16px rgba(255, 107, 53, 0.9);
      flex-shrink: 0;
    }

    .alert-overlay {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 55;
      align-items: center;
      justify-content: center;
      padding: 1rem 0.85rem 1.5rem;
      background: rgba(6, 4, 10, 0.48);
      backdrop-filter: blur(8px);
    }

    .alert-overlay.show {
      display: flex;
    }

    .alert-card {
      position: relative;
      width: min(96%, 980px);
      max-height: 88%;
      overflow: auto;
      padding: 3rem 2.75rem 2.5rem;
      border-radius: 32px;
      border: 2px solid rgba(255, 130, 80, 0.45);
      background:
        linear-gradient(145deg, rgba(48, 20, 28, 0.92), rgba(24, 14, 32, 0.88)),
        radial-gradient(circle at 20% 0%, rgba(255, 120, 60, 0.22), transparent 55%);
      box-shadow:
        0 32px 100px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      color: #fff;
      animation: alert-card-glow 2.6s ease-in-out infinite;
    }

    @keyframes alert-card-glow {
      0%, 100% {
        border-color: rgba(255, 130, 80, 0.45);
        box-shadow: 0 32px 100px rgba(0, 0, 0, 0.5), 0 0 0 0 rgba(255, 100, 50, 0.2);
      }
      50% {
        border-color: rgba(255, 170, 100, 0.75);
        box-shadow: 0 36px 110px rgba(0, 0, 0, 0.55), 0 0 48px 10px rgba(255, 100, 50, 0.18);
      }
    }

    .alert-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 1.85rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .alert-close:active {
      transform: scale(0.94);
    }

    .alert-icon {
      font-size: clamp(3.5rem, 12cqw, 5.25rem);
      line-height: 1;
      margin-bottom: 0.75rem;
      filter: drop-shadow(0 6px 24px rgba(255, 120, 60, 0.45));
    }

    .alert-card .eyebrow {
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: clamp(1.05rem, 3.2cqw, 1.35rem);
      color: rgba(255, 190, 140, 0.98);
      margin-bottom: 0.5rem;
    }

    .alert-card h2 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 8cqw, 3.75rem);
      font-weight: 800;
      line-height: 1.06;
      margin-bottom: 0.85rem;
      text-wrap: balance;
    }

    .alert-card p {
      font-weight: 700;
      font-size: clamp(1.35rem, 4.8cqw, 1.95rem);
      line-height: 1.42;
      color: rgba(255, 255, 255, 0.94);
      max-width: none;
      overflow: visible;
      display: block;
      -webkit-line-clamp: unset;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      flex-shrink: 0;
      min-height: 0;
    }

    .clock-card {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 1.1rem;
      padding: 0.35rem 0.55rem;
      min-width: 0;
      overflow: hidden;
      container-type: inline-size;
    }

    .clock-card .time {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(3rem, 24cqw, 5.5rem);
      line-height: 0.9;
      letter-spacing: -0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .clock-card .date-stack {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.06rem;
      min-width: 0;
      flex: 1 1 auto;
    }

    .clock-card .day-line {
      font-family: var(--font-display);
      font-size: clamp(1.05rem, 8cqw, 1.65rem);
      font-weight: 800;
      line-height: 1.05;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .clock-card .date-line {
      font-family: var(--font-display);
      font-size: clamp(0.95rem, 7cqw, 1.45rem);
      font-weight: 800;
      line-height: 1.05;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .weather-strip {
      min-width: 0;
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 0.35rem;
      padding: 0.3rem 0.4rem;
      container-type: inline-size;
    }

    .wx-now-compact {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
      flex: 1 1 0;
    }

    .wx-icon {
      width: clamp(58px, 16cqw, 84px);
      height: clamp(58px, 16cqw, 84px);
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .wx-icon .wx-svg,
    .fday .wx-svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .wx-now-compact .temp {
      font-family: var(--font-display);
      font-size: clamp(3rem, 20cqw, 4.75rem);
      font-weight: 800;
      line-height: 0.95;
      letter-spacing: -0.03em;
      flex: 1 1 auto;
      min-width: 0;
    }

    .forecast {
      display: flex;
      gap: 0.18rem;
      flex: 1.15 1 0;
      min-width: 0;
      justify-content: flex-end;
      overflow: hidden;
    }

    .fday {
      flex: 1 1 0;
      min-width: 0;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 0.12rem;
      text-align: center;
      padding: 0.25rem 0.15rem 0.2rem;
      line-height: 1.05;
    }

    .fday.today .hi {
      color: var(--coral);
    }

    .fday .d {
      font-weight: 800;
      font-size: clamp(0.52rem, 2.4cqw, 0.64rem);
      color: var(--ink-soft);
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.1;
      width: 100%;
    }

    .fday .ico {
      width: clamp(34px, 8.5cqw, 46px);
      height: clamp(34px, 8.5cqw, 46px);
      display: grid;
      place-items: center;
      margin: 0.05rem 0;
    }

    .fday .temps {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 0.28rem;
      width: 100%;
    }

    .fday .hi {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(0.72rem, 3.4cqw, 0.92rem);
      line-height: 1;
    }

    .fday .lo {
      font-weight: 700;
      font-size: clamp(0.62rem, 2.8cqw, 0.78rem);
      color: var(--ink-soft);
      line-height: 1;
    }

    .body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
      container-type: size;
    }

    .agenda {
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      padding: 0.55rem 0.7rem 0.55rem 0.8rem;
      container-type: inline-size;
    }

    .agenda h2,
    .block-title {
      font-family: var(--font-display);
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .source-pill,
    .list-source {
      font-family: var(--font-body);
      font-size: 0.68rem;
      font-weight: 800;
      color: var(--ink-soft);
    }

    .agenda-clip {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .agenda-clip::after {
      content: none;
    }

    .day-group + .day-group { margin-top: 1rem; }

    .day-head {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      padding: 0.5rem 0.15rem 0.55rem;
      margin-bottom: 0.3rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.7rem, 4.2cqw, 2.4rem);
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .day-head .date-num {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3cqw, 1.7rem);
      font-weight: 800;
      color: var(--ink-soft);
      letter-spacing: 0;
    }

    .agenda-rows {
      list-style: none;
      padding-top: 0.15rem;
      width: 100%;
    }

    .agenda-row {
      display: grid;
      grid-template-columns: minmax(5.5rem, 22%) 1fr;
      gap: 0.75rem;
      align-items: start;
      padding: 0.7rem 0.2rem 0.7rem 0.45rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      border-left: 4px solid var(--kid-color, transparent);
    }

    .agenda-row:last-child { border-bottom: none; }

    .agenda-row .time {
      font-weight: 800;
      font-size: clamp(1.05rem, 2.6cqw, 1.35rem);
      color: var(--kid-color, var(--sky));
      padding-top: 0.15rem;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .agenda-row .title {
      font-weight: 700;
      font-size: clamp(1.25rem, 3.2cqw, 1.7rem);
      line-height: 1.3;
    }

    .agenda-row .kid-tag {
      display: inline-block;
      margin-right: 0.4rem;
      font-size: 1.35rem;
      line-height: 1;
    }

    .agenda-row.all-day .time {
      color: var(--kid-color, var(--sunny));
    }

    .empty-note {
      color: var(--ink-soft);
      font-weight: 700;
      padding: 0.6rem 0.1rem;
      font-size: 1.25rem;
    }

    .right-col {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      min-height: 0;
      height: 100%;
      overflow: hidden;
      width: 100%;
    }

    .month-panel {
      width: 100%;
      flex: 1 1 48%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 0.35rem 0.3rem 0.3rem;
      container-type: size;
    }

    .month-panel .block-title {
      margin-bottom: 0.15rem;
      flex-shrink: 0;
      justify-content: flex-start;
      padding: 0.1rem 0.05rem 0.4rem;
      min-height: clamp(2.2rem, 10cqh, 3.4rem);
      align-items: flex-end;
    }

    .month-label {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(2.2rem, 12cqw, 3.6rem);
      color: var(--ink);
      line-height: 1;
    }

    .month-grid-wrap {
      width: 100%;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      container-type: size;
    }

    .cal-grid {
      flex: 1;
      min-height: 0;
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: auto repeat(6, 1fr);
      gap: 0.04rem;
    }

    .dow {
      text-align: center;
      font-family: var(--font-display);
      font-size: clamp(1.1rem, min(9cqw, 12cqh), 2rem);
      font-weight: 800;
      color: var(--ink-soft);
      text-transform: uppercase;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      min-height: 0;
      overflow: hidden;
    }

    .day {
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(1.5rem, min(14cqw, 22cqh), 2.8rem);
      line-height: 1;
      color: var(--ink-soft);
      background: transparent;
      padding: 0;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .day.empty { background: transparent; }

    .day.today {
      color: var(--coral);
      border: 1.5px solid var(--coral);
      background: rgba(255, 122, 89, 0.1);
    }

    .list-panel {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
      padding: 0.55rem 0.5rem;
      height: 100%;
      width: 100%;
    }

    .lists {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.45rem;
      flex: 1 1 52%;
      min-height: 0;
      overflow: hidden;
      width: 100%;
    }

    .list-panel .block-title {
      font-size: clamp(1.15rem, 3.4cqw, 1.45rem);
      margin-bottom: 0.4rem;
      flex-shrink: 0;
    }

    .list-scroll {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      padding-bottom: 0.15rem;
      -webkit-overflow-scrolling: touch;
    }

    .checklist {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    .checklist li {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem;
      align-items: start;
      background: transparent;
      border-radius: 0;
      padding: 0.6rem 0.12rem;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      cursor: default;
      font-weight: 700;
      font-size: clamp(1.15rem, 3.2cqw, 1.5rem);
      line-height: 1.25;
      flex-shrink: 0;
    }

    body:not(.kiosk) .checklist li[data-id] {
      cursor: pointer;
    }

    .checklist li:last-child {
      border-bottom: none;
    }

    .checklist li .txt {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: normal;
      min-width: 0;
    }

    .checklist li.empty-list {
      cursor: default;
      color: var(--ink-soft);
      grid-template-columns: 1fr;
      background: transparent;
      border: none;
      font-size: 1.05rem;
      white-space: normal;
    }

    .checklist .list-dot {
      color: var(--ink-soft);
      font-size: 1.35rem;
      line-height: 1.25;
      width: 18px;
      text-align: center;
    }

    .box {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      border: 1.5px solid rgba(255, 255, 255, 0.18);
      background: transparent;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
      color: #000;
    }

    .checklist li.done .box {
      background: var(--mint);
      border-color: var(--mint);
    }

    .add-row {
      display: none;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.5);
      animation: live 2s ease-in-out infinite;
      display: inline-block;
      margin-right: 0.35rem;
    }

    @keyframes live {
      0%, 100% { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.45); }
      50% { box-shadow: 0 0 0 5px rgba(61, 220, 151, 0); }
    }
  </style>
</head>
<body class="tv-stage">
  <div class="tv-frame">
    <div class="alert-pill" id="alertPill">
      <button type="button" class="alert-pill-btn" id="alertPillBtn" aria-label="Open weather advisory">
        <span class="alert-pill-dot" aria-hidden="true"></span>
        <span id="alertPillLabel">Weather advisory</span>
      </button>
    </div>

    <div class="alert-overlay" id="alertOverlay" role="alertdialog" aria-modal="true" aria-labelledby="alertTitle">
      <article class="alert-card">
        <button type="button" class="alert-close" id="alertClose" aria-label="Dismiss weather advisory">×</button>
        <div class="alert-icon" id="alertIcon" aria-hidden="true">⚠️</div>
        <div class="eyebrow" id="alertEyebrow">Weather alert</div>
        <h2 id="alertTitle">Severe weather</h2>
        <p id="alertBody"></p>
      </article>
    </div>

    <div class="screen">
      <header class="header">
        <section class="panel clock-card" aria-label="Time and date">
          <div class="time" id="clock">—:—</div>
          <div class="date-stack">
            <div class="day-line" id="dayLabel">—</div>
            <div class="date-line" id="dateLabel">—</div>
          </div>
        </section>

        <section class="panel weather-strip" aria-label="Weather">
          <div class="wx-now-compact">
            <div class="wx-icon" id="wxIcon" aria-hidden="true"></div>
            <div class="temp" id="wxTemp">--°</div>
          </div>
          <div class="forecast" id="forecast" aria-label="5 day forecast"></div>
        </section>
      </header>

      <div class="body">
        <section class="panel agenda" aria-label="Weekly agenda">
          <div class="agenda-clip">
            <div id="agendaList"></div>
          </div>
        </section>

        <div class="right-col">
          <section class="panel month-panel" aria-label="Monthly calendar">
            <div class="block-title">
              <span class="month-label" id="monthLabel"></span>
            </div>
            <div class="month-grid-wrap">
              <div class="cal-grid" id="calGrid"></div>
            </div>
          </section>

          <div class="lists">
            <section class="panel list-panel" aria-label="Grocery list">
              <div class="block-title">
                <span>Groceries</span>
                <span class="list-source" id="grocerySource">Sync</span>
              </div>
              <div class="list-scroll">
                <ul class="checklist" id="groceryList" data-list="grocery"></ul>
                <button type="button" class="list-add-btn" data-open-list="grocery">+ Add grocery</button>
              </div>
            </section>
            <section class="panel list-panel" aria-label="Reminders">
              <div class="block-title">
                <span>Reminders</span>
                <span class="list-source" id="reminderSource">Sync</span>
              </div>
              <div class="list-scroll">
                <ul class="checklist" id="reminderList" data-list="reminders"></ul>
                <button type="button" class="list-add-btn" data-open-list="reminders">+ Add reminder</button>
              </div>
            </section>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../shared/weather-icons.js"></script>
  <script src="../shared/touch-input.js"></script>
  <script src="../shared/calendar-colors.js"></script>
  <script src="../shared/calendar.js"></script>
  <script src="../shared/family-api.js"></script>
  <script src="../shared/list-undo.js"></script>
  <script src="../shared/display-sync.js"></script>
  <script src="../shared/live-reload.js"></script>
  <script src="../shared/night-mode.js"></script>
  <script src="../shared/screensaver.js"></script>
  <script src="../shared/alerts.js"></script>
  <script src="../shared/screens.js"></script>
  <script src="../shared/kiosk-nav.js"></script>
  <script>
    const CFG = window.FAMILY_CONFIG;
    let events = [];
    let agendaKids = CFG.kids || [];
    const listState = {
      grocery: { items: [] },
      reminders: { items: [] },
    };

    const IS_KIOSK = new URLSearchParams(location.search).has("kiosk");
    if (IS_KIOSK) {
      document.body.classList.add("kiosk");
    }

    function setWxIcon(el, code) {
      if (!el) return;
      el.innerHTML = WeatherIcons.svg(code);
    }

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function updateClock() {
      const now = new Date();
      const h = now.getHours();
      const nextTime = `${h % 12 || 12}:${pad(now.getMinutes())} ${h >= 12 ? "PM" : "AM"}`;
      const weekday = now.toLocaleDateString(undefined, { weekday: "long" });
      const rest = now.toLocaleDateString(undefined, { month: "long", day: "numeric" });
      const clock = document.getElementById("clock");
      const dayLabel = document.getElementById("dayLabel");
      const dateLabel = document.getElementById("dateLabel");
      if (clock.textContent !== nextTime) clock.textContent = nextTime;
      if (dayLabel.textContent !== weekday) dayLabel.textContent = weekday;
      if (dateLabel.textContent !== rest) dateLabel.textContent = rest;
    }

    let weatherFp = "";
    const WEATHER_CACHE_KEY = "family-board-weather-cache-v1";

    function applyWeatherData(data) {
      const fp = JSON.stringify({
        code: data.current.weather_code,
        t: data.current.temperature_2m,
        w: data.current.wind_speed_10m,
        daily: data.daily,
      });
      if (fp === weatherFp) return;
      weatherFp = fp;

      setWxIcon(document.getElementById("wxIcon"), data.current.weather_code);
      document.getElementById("wxTemp").textContent = `${Math.round(data.current.temperature_2m)}°`;

      const root = document.getElementById("forecast");
      const today = new Date();
      root.innerHTML = data.daily.time
        .map((iso, i) => {
          const d = new Date(`${iso}T12:00:00`);
          const code = data.daily.weather_code[i];
          const name =
            i === 0
              ? "Today"
              : d.toLocaleDateString(undefined, { weekday: "short" });
          const isToday =
            d.getDate() === today.getDate() &&
            d.getMonth() === today.getMonth();
          return `
              <div class="fday${isToday ? " today" : ""}">
                <div class="d">${name}</div>
                <div class="ico">${WeatherIcons.svg(code)}</div>
                <div class="temps">
                  <span class="hi">${Math.round(data.daily.temperature_2m_max[i])}°</span>
                  <span class="lo">${Math.round(data.daily.temperature_2m_min[i])}°</span>
                </div>
              </div>`;
        })
        .join("");
    }

    function loadCachedWeather() {
      try {
        const raw = localStorage.getItem(WEATHER_CACHE_KEY);
        if (!raw) return false;
        const cached = JSON.parse(raw);
        if (!cached?.data?.current || !cached?.data?.daily) return false;
        applyWeatherData(cached.data);
        return true;
      } catch {
        return false;
      }
    }

    async function loadWeather() {
      const { latitude, longitude, tempUnit, windUnit, timezone } = CFG.weather;
      const temp = tempUnit === "celsius" ? "celsius" : "fahrenheit";
      const wind = windUnit === "kmh" ? "kmh" : "mph";
      const tz = timezone || "America/Chicago";
      const url =
        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}` +
        `&current=temperature_2m,weather_code,wind_speed_10m` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
        `&temperature_unit=${temp}&wind_speed_unit=${wind}&timezone=${encodeURIComponent(tz)}&forecast_days=5`;
      try {
        const data = await (await fetch(url, { signal: AbortSignal.timeout(4000) })).json();
        applyWeatherData(data);
        try {
          localStorage.setItem(
            WEATHER_CACHE_KEY,
            JSON.stringify({ savedAt: Date.now(), data })
          );
        } catch (_) {
          /* quota / private mode */
        }
      } catch {
        if (!loadCachedWeather()) {
          // Offline with no cache — still show a clear local SVG icon
          setWxIcon(document.getElementById("wxIcon"), 2);
          document.getElementById("wxTemp").textContent = "--°";
        }
      }
    }

    const alertUI = {
      currentId: null,
      dismissed: false,
    };

    function alertDismissKey(id) {
      return `fb-alert-dismiss:${id}`;
    }

    function alertIconFor(eventName) {
      const name = String(eventName || "").toLowerCase();
      if (name.includes("tornado")) return "🌪️";
      if (name.includes("thunder") || name.includes("lightning")) return "⛈️";
      if (name.includes("flood")) return "🌊";
      if (name.includes("winter") || name.includes("snow") || name.includes("ice")) return "❄️";
      if (name.includes("heat")) return "🌡️";
      if (name.includes("wind")) return "💨";
      if (name.includes("fire")) return "🔥";
      if (name.includes("fog")) return "🌫️";
      return "⚠️";
    }

    function hideAlertUI() {
      document.getElementById("alertOverlay").classList.remove("show");
      document.getElementById("alertPill").classList.remove("show");
      alertUI.currentId = null;
      alertUI.dismissed = false;
    }

    function showAlertUI(top, { forceOpen = false } = {}) {
      const overlay = document.getElementById("alertOverlay");
      const pill = document.getElementById("alertPill");
      const alertId = top.id || `${top.event}:${top.severity}`;

      if (alertUI.currentId !== alertId) {
        alertUI.currentId = alertId;
        alertUI.dismissed = !!sessionStorage.getItem(alertDismissKey(alertId));
      }

      document.getElementById("alertIcon").innerHTML = `<span class="emoji">${alertIconFor(top.event)}</span>`;
      document.getElementById("alertEyebrow").textContent = `${top.severity} · National Weather Service`;
      document.getElementById("alertTitle").textContent = top.event;
      document.getElementById("alertBody").textContent = top.headline || top.description;
      document.getElementById("alertPillLabel").textContent = top.event;

      pill.classList.add("show");
      overlay.classList.toggle("show", forceOpen || !alertUI.dismissed);
    }

    async function loadAlerts() {
      const demo = new URLSearchParams(location.search).has("demoAlert");
      try {
        const alerts = demo
          ? [{
              id: "demo-severe-thunderstorm",
              event: "Severe Thunderstorm Warning",
              severity: "Severe",
              headline: "DEMO: Severe thunderstorms capable of damaging winds and large hail are moving through your area. Take shelter indoors away from windows until the storm passes.",
              description: "",
            }]
          : await FamilyAlerts.fetchAlerts(CFG);
        if (!alerts.length) {
          hideAlertUI();
          return;
        }
        showAlertUI(alerts[0]);
      } catch (err) {
        console.warn("Alert fetch failed", err);
        hideAlertUI();
      }
    }

    document.getElementById("alertClose").addEventListener("click", () => {
      if (alertUI.currentId) {
        sessionStorage.setItem(alertDismissKey(alertUI.currentId), "1");
      }
      alertUI.dismissed = true;
      document.getElementById("alertOverlay").classList.remove("show");
    });

    document.getElementById("alertPillBtn").addEventListener("click", () => {
      document.getElementById("alertOverlay").classList.add("show");
    });

    function renderMonth() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth();
      document.getElementById("monthLabel").textContent = now.toLocaleDateString(undefined, {
        month: "long",
        year: "numeric",
      });

      const grid = document.getElementById("calGrid");
      grid.innerHTML = "";
      ["S", "M", "T", "W", "T", "F", "S"].forEach((d) => {
        const el = document.createElement("div");
        el.className = "dow";
        el.textContent = d;
        grid.appendChild(el);
      });

      const startDow = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < startDow; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        grid.appendChild(empty);
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement("div");
        cell.className = "day" + (day === now.getDate() ? " today" : "");
        cell.textContent = day;
        grid.appendChild(cell);
      }
      const dayCells = 42;
      const filled = startDow + daysInMonth;
      for (let i = filled; i < dayCells; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        grid.appendChild(empty);
      }
    }

    function dayKey(d) {
      return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    }

    function dayHeading(d) {
      const now = FamilyCalendar.startOfDay(new Date());
      const day = FamilyCalendar.startOfDay(d);
      const diff = Math.round((day - now) / 86400000);
      const dateNum = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
      if (diff === 0) return { label: "Today", showDate: false };
      if (diff === 1) return { label: "Tomorrow", showDate: false };
      return {
        label: d.toLocaleDateString(undefined, { weekday: "long" }),
        dateNum,
        showDate: true,
      };
    }

    function formatTime(ev) {
      if (ev.allDay) return "All day";
      return ev.start.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    }

    let calendarSource = "";
    let calendarError = "";

    function renderAgenda() {
      const root = document.getElementById("agendaList");
      // Pull extra events; clip/fade hides overflow instead of scrolling
      const items = FamilyCalendar.upcoming(events, 40);
      if (!items.length) {
        if (calendarError && (calendarSource === "offline" || calendarSource === "demo")) {
          root.innerHTML = `<div class="empty-note">Google Calendar offline<br><span style="font-size:0.75em;opacity:0.75">${calendarError}</span></div>`;
        } else {
          root.innerHTML = `<div class="empty-note">No upcoming events</div>`;
        }
        return;
      }

      const groups = [];
      const map = new Map();
      items.forEach((ev) => {
        const key = dayKey(ev.start);
        if (!map.has(key)) {
          const g = { key, start: FamilyCalendar.startOfDay(ev.start), events: [] };
          map.set(key, g);
          groups.push(g);
        }
        map.get(key).events.push(ev);
      });

      root.innerHTML = groups
        .map((g) => {
          const head = dayHeading(g.start);
          const dateHtml = head.showDate
            ? `<span class="date-num">${head.dateNum}</span>`
            : "";
          const rows = g.events
            .map((ev) => {
              const kid = FamilyCalendarColors.matchKid(ev.title, agendaKids);
              const kidStyle = kid ? `--kid-color:${kid.color}` : "";
              const kidTag = kid ? `<span class="kid-tag emoji">${kid.emoji || ""}</span>` : "";
              return `
              <li class="agenda-row${ev.allDay ? " all-day" : ""}" style="${kidStyle}">
                <div class="time">${formatTime(ev)}</div>
                <div class="title">${kidTag}${ev.title}</div>
              </li>`;
            })
            .join("");
          return `
            <section class="day-group">
              <div class="day-head">
                <span>${head.label}</span>
                ${dateHtml}
              </div>
              <ul class="agenda-rows">${rows}</ul>
            </section>`;
        })
        .join("");
    }

    function listItemsForDisplay(items) {
      return (items || []).filter((item) => !item.done);
    }

    function syncListStateFromApi(state) {
      listState.grocery.items = state.lists?.grocery || [];
      listState.reminders.items = state.lists?.reminders || [];
      listsFp = JSON.stringify({
        grocery: listState.grocery.items,
        reminders: listState.reminders.items,
      });
      renderChecklist("grocery");
      renderChecklist("reminders");
    }

    async function clearListItem(kind, itemId) {
      if (IS_KIOSK || document.body.classList.contains("kiosk")) return;
      const res = await FamilyAPI.toggleListItem(kind, itemId);
      syncListStateFromApi(res.state);
      if (res.item && window.ListUndo) {
        ListUndo.offer(`Removed "${res.item.text}"`, async () => {
          const undo = await FamilyAPI.restoreListItem(kind, res.item, res.index);
          syncListStateFromApi(undo.state);
        });
      }
    }

    function wireChecklists() {
      // Clear grocery/reminders only from Admin — never on the kiosk
      if (IS_KIOSK || document.body.classList.contains("kiosk")) return;

      document.querySelectorAll(".checklist[data-list]").forEach((ul) => {
        if (ul.dataset.bound === "1") return;
        ul.dataset.bound = "1";
        ul.addEventListener("click", async (e) => {
          if (IS_KIOSK || document.body.classList.contains("kiosk")) return;
          const li = e.target.closest("li[data-id]");
          if (!li) return;
          e.preventDefault();
          e.stopPropagation();
          try {
            await clearListItem(ul.dataset.list, li.dataset.id);
          } catch (err) {
            console.warn("Failed to clear list item", err);
          }
        });
      });
    }

    function renderChecklist(kind) {
      const listId = kind === "grocery" ? "groceryList" : "reminderList";
      const state = listState[kind];
      const root = document.getElementById(listId);
      const items = listItemsForDisplay(state.items);
      const canClear = !(IS_KIOSK || document.body.classList.contains("kiosk"));

      if (!items.length) {
        root.dataset.ids = "";
        root.innerHTML = canClear
          ? `<li class="empty-list">No items yet — tap + Add below</li>`
          : `<li class="empty-list">No items yet — tap + Add, or clear from Admin</li>`;
        return;
      }

      const ids = items.map((item) => item.id).join("|");
      if (root.dataset.ids === ids && root.querySelector("li")) {
        items.forEach((item, index) => {
          const li = root.children[index];
          if (!li || li.classList.contains("empty-list")) return;
          const txt = li.querySelector(".txt");
          if (txt) txt.textContent = item.text;
          if (canClear) li.dataset.id = item.id;
          else delete li.dataset.id;
        });
        return;
      }

      root.dataset.ids = ids;
      root.innerHTML = items
        .map(
          (item) => `
          <li${canClear ? ` data-id="${item.id}"` : ""}>
            <span class="list-dot" aria-hidden="true">•</span>
            <span class="txt">${item.text}</span>
          </li>`
        )
        .join("");
      wireChecklists();
    }

    function wireListAddButtons() {
      document.querySelectorAll("[data-open-list]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const kind = btn.dataset.openList;
          const isGrocery = kind === "grocery";
          TouchInput.open({
            title: isGrocery ? "Add grocery" : "Add reminder",
            placeholder: isGrocery ? "e.g. Milk, Bread…" : "e.g. Call dentist…",
            onSubmit: async (text) => {
              try {
                const res = await FamilyAPI.addListItem(kind, text);
                syncListStateFromApi(res.state);
                if (res.item && window.ListUndo) {
                  ListUndo.offer(`Added "${text}"`, async () => {
                    const undo = await FamilyAPI.toggleListItem(kind, res.item.id, {
                      allowOnKiosk: true,
                    });
                    syncListStateFromApi(undo.state);
                  });
                }
              } catch (err) {
                console.warn("Failed to add list item", err);
              }
            },
          });
        });
      });
    }

    let eventsFp = "";
    let listsFp = "";

    async function loadCalendar() {
      const result = await FamilyCalendar.loadEvents(CFG);
      calendarSource = result.source || "";
      calendarError = result.error || "";
      const fp = JSON.stringify(
        [calendarSource, calendarError].concat(
          (result.events || []).map((e) => [e.id, e.title, +e.start, +e.end, e.allDay])
        )
      );
      if (fp === eventsFp) return;
      eventsFp = fp;
      events = result.events;
      if (calendarSource === "demo" && calendarError) {
        console.warn("Using demo calendar events:", calendarError);
      }
      renderAgenda();
      renderMonth();
    }

    async function loadLists() {
      try {
        const data = await FamilyAPI.getState();
        agendaKids = data.kids?.length ? data.kids : CFG.kids || [];
        const nextGrocery = data.lists?.grocery || [];
        const nextReminders = data.lists?.reminders || [];
        const fp = JSON.stringify({ grocery: nextGrocery, reminders: nextReminders });
        if (fp === listsFp) return;
        listsFp = fp;
        listState.grocery.items = nextGrocery;
        listState.reminders.items = nextReminders;
        renderChecklist("grocery");
        renderChecklist("reminders");
        renderAgenda();
      } catch (err) {
        console.warn("Family API lists unavailable.", err);
        document.getElementById("groceryList").innerHTML =
          `<li class="empty-list">Can't reach server — run <strong>python server.py</strong></li>`;
        document.getElementById("reminderList").innerHTML =
          `<li class="empty-list">Can't reach server</li>`;
      }
    }

    wireListAddButtons();
    wireChecklists();

    updateClock();
    loadCachedWeather();
    loadWeather();
    loadAlerts();
    loadCalendar();
    loadLists();

    // Realtime-ish refresh cadence (Pi kiosk friendly)
    setInterval(updateClock, 1000);
    setInterval(loadWeather, 5 * 60 * 1000);
    setInterval(loadAlerts, 3 * 60 * 1000);
    setInterval(loadCalendar, 60 * 1000);
    setInterval(loadLists, 2500);
    // Month highlight only needs day-rollover checks
    setInterval(() => {
      const day = new Date().getDate();
      if (loadLists._day !== day) {
        loadLists._day = day;
        renderMonth();
      }
    }, 30 * 1000);

    // Refresh when coming back online / tab visible
    window.addEventListener("online", () => {
      loadWeather();
      loadCalendar();
      loadLists();
      loadAlerts();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        updateClock();
        loadWeather();
        loadCalendar();
        loadLists();
      }
    });
  </script>
</body>
</html>
