<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Board</title>
  <script src="../shared/config.js"></script>
  <script src="../shared/kiosk-theme.js"></script>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="preload" href="../shared/fonts/Baloo2-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../shared/fonts/Nunito-700.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    html, body.kiosk {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg0, #000);
    }

    #kioskShell {
      position: fixed;
      inset: 0;
      background: var(--bg0, #000);
    }

    .screen-frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg0, #000);
      opacity: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Next screen sits fully painted under the current one, so a swap never exposes black. */
    .screen-frame.is-staged {
      opacity: 1;
      z-index: 1;
    }

    .screen-frame.is-front {
      opacity: 1;
      z-index: 2;
      pointer-events: auto;
    }

    .screen-frame.is-front.is-leaving {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.42s ease;
    }
  </style>
</head>
<body class="kiosk">
  <div id="kioskShell"></div>
  <script src="../shared/family-api.js"></script>
  <script src="../shared/screens.js"></script>
  <script src="../shared/live-reload.js?v=2"></script>
  <script src="../shared/kiosk-navigator.js?v=3"></script>
</body>
</html>
