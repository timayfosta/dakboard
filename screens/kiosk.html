<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Board</title>
  <script src="../shared/config.js"></script>
  <script src="../shared/kiosk-theme.js"></script>
  <link rel="stylesheet" href="../shared/fonts.css" />
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="preload" href="../shared/fonts/Baloo2-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="../shared/fonts/Nunito-700.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    html, body.kiosk {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg0, #000);
    }

    #kioskShell {
      position: fixed;
      inset: 0;
      background: var(--bg0, #000);
    }

    #screenFrame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: var(--bg0, #000);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    #screenFrame.ready {
      opacity: 1;
    }

    #kioskShell.loading #screenFrame:not(.ready) {
      opacity: 0;
    }
  </style>
</head>
<body class="kiosk">
  <div id="kioskShell">
    <iframe id="screenFrame" title="Family Board"></iframe>
  </div>
  <script src="../shared/family-api.js"></script>
  <script src="../shared/screens.js"></script>
  <script src="../shared/live-reload.js"></script>
  <script src="../shared/kiosk-navigator.js"></script>
</body>
</html>
