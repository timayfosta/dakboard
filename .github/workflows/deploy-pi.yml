name: Deploy to Pi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PI_HOST }}
          username: ${{ secrets.PI_USER }}
          key: ${{ secrets.PI_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            ROOT=""
            for candidate in "$HOME/family-board" "$HOME/dakboard" "$HOME/Projects/dakboard"; do
              if [[ -d "$candidate/.git" ]]; then
                ROOT="$candidate"
                break
              fi
            done
            if [[ -z "$ROOT" ]]; then
              echo "Could not find git repo (tried ~/family-board, ~/dakboard, ~/Projects/dakboard)" >&2
              exit 1
            fi
            echo "Deploying in $ROOT"
            cd "$ROOT"
            bash scripts/deploy_update.sh
            echo "Deploy finished. Open clients will auto-reload via /api/health bootId."
